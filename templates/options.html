{% extends "base.html" %}

{% block back_link %}
<a href="/logout" class="back-link" data-i18n="logout">Logout</a>
{% endblock %}

{% block content %}
<div class="options-container">
    <h2 class="options-header" data-i18n="choose_option">Please, choose an option:</h2>
    
    <div class="options-row">
        <!-- Card 1: Register new simulation -->
        <div class="option-card">
            <div class="option-icon">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#003366" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
            </div>
            <a href="/setup" class="btn btn-delphi-option" data-i18n="new_simulation">Create new simulation</a>
        </div>
        
        <!-- Card 2: Continue a registered simulation -->
        <div class="option-card">
            <div class="option-icon">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#006699" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </div>
            <a href="/continue" class="btn btn-delphi-option" data-i18n="load_simulation">Load saved simulation</a>
        </div>
    </div>
</div>
{% endblock %}
